<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSearch Pro - 沃华医药智能助手</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>DeepSearch Pro</h1>
                <p class="subtitle">沃华医药智能助手</p>
                <button id="newChatBtn" class="new-chat-btn" type="button">新建对话</button>
                <a class="knowledge-link" href="http://127.0.0.1:8080" target="_blank" rel="noopener noreferrer">知识库管理 ↗</a>
            </div>

            <div class="sidebar-section">
                <div class="section-title">
                    <span>生成的文件</span>
                    <button id="refreshFilesBtn" class="icon-btn" type="button" title="刷新文件列表">刷新</button>
                </div>
                <div id="fileList" class="file-list">
                    <p class="empty-hint">暂无文件</p>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="connection-status" id="connStatus">
                    <span class="status-dot disconnected"></span>
                    <span class="status-text">未连接</span>
                </div>
            </div>
        </aside>

        <main class="chat-main">
            <header class="chat-header">
                <h2>智能对话</h2>
                <div class="header-info">
                    <span id="threadIdDisplay" class="thread-id"></span>
                </div>
            </header>

            <div id="chatArea" class="chat-area">
                <div class="welcome-message">
                    <div class="welcome-icon">AI</div>
                    <h3>欢迎使用 DeepSearch Pro</h3>
                    <p>我可以协助查询药品信息、搜索公开资料、检索知识库、分析上传文件，并生成 Markdown 或 PDF 报告。</p>
                    <div class="suggestions">
                        <button class="suggestion-btn" type="button" data-query="查询所有药品信息，并生成一份 Markdown 报告">
                            查询药品信息并生成报告
                        </button>
                        <button class="suggestion-btn" type="button" data-query="搜索布洛芬的最新研究进展">
                            搜索布洛芬研究进展
                        </button>
                        <button class="suggestion-btn" type="button" data-query="查询销售记录最多的药品，并生成 PDF 报告">
                            生成销售数据分析报告
                        </button>
                    </div>
                </div>
            </div>

            <div id="progressPanel" class="progress-panel hidden">
                <div class="progress-header">
                    <span class="spinner"></span>
                    <span id="progressText">正在处理...</span>
                </div>
                <div id="progressSteps" class="progress-steps"></div>
            </div>

            <div class="input-area">
                <p class="attachment-hint">附件用于当前对话；长期保存和检索请在“知识库管理”中上传。每个文件最多 50 MB。</p>
                <div id="uploadPreview" class="upload-preview hidden"></div>
                <div class="input-row">
                    <div class="upload-wrapper">
                        <input type="file" id="fileInput" accept=".txt,.md,.csv,.json,.yml,.yaml,.docx,.pdf,.xlsx,.xls" multiple hidden>
                        <button id="uploadBtn" class="icon-btn-lg" type="button" title="上传文件">上传</button>
                    </div>
                    <textarea id="messageInput" class="message-input" placeholder="输入您的问题... (Enter 发送，Shift+Enter 换行)" rows="1"></textarea>
                    <button id="sendBtn" class="send-btn" type="button" title="发送">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
                        </svg>
                    </button>
                    <button id="stopBtn" class="stop-btn hidden" type="button" title="停止生成">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="/static/app.js"></script>
</body>
</html>
